# Build distributables on GitHub (do NOT commit `dist/` — it is gitignored and too large for git).
# Local `npm run dist` = Apple Silicon DMG only; this workflow builds Intel + Apple Silicon DMGs + Windows NSIS (3 outputs across 2 runners).
# Artifacts: download from the workflow run, or from a GitHub Release when you push a tag.
#
# Tag → Release (macOS: Intel + Apple Silicon DMGs only; Windows: NSIS x64):
#   git tag -a v1.0.1 -m "Release 1.0.1"
#   git push origin v1.0.1
#
# Manual: Actions → "Release Hand Lab" → Run workflow → Artifacts only by default.
# To publish installers to a Release from a manual run: enable "Publish to GitHub Release"
# and set "Release git tag" to an existing tag (e.g. v0.9.2 — must exist on GitHub).
#
# Iterating on the SAME tag/version (no new tag, no version bump):
# - Push workflow fixes to main (or your working branch).
# - Actions → Run workflow → choose that branch (so the latest workflow YAML runs).
# - Optional "Checkout ref for build": set to your tag (e.g. v0.9.01) or a commit SHA so the
#   built installers match that snapshot; leave empty to build whatever HEAD is on the branch you chose.
# - Enable "Publish to GitHub Release" and set "Release git tag" to the SAME tag (e.g. v0.9.01).
# - action-gh-release overwrites same-named assets on that Release when you re-run.
#
# If you ever committed `dist/` by mistake:  git rm -r --cached dist

name: Release Hand Lab

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach installers to a GitHub Release (manual runs only)"
        type: boolean
        default: false
      release_tag:
        description: "Existing git tag for that Release (e.g. v0.9.2). Required if publishing."
        type: string
        required: false
      checkout_ref:
        description: "Optional: tag or SHA to build (e.g. v0.9.01). Empty = build the branch you select below. Use when fixing CI for an existing tag without moving the tag."
        type: string
        required: false

permissions:
  contents: read

# Official JS actions use Node 24 runtimes (see actions/checkout@v6, upload-artifact@v6, …).
# Self-hosted runners need Actions Runner ≥ 2.327.1 (checkout@v5+) / see each action’s release notes.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Manual: optional snapshot (tag/SHA). Push-to-tag: always that tag ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.ref }}

      - name: Resolve app directory
        id: paths
        shell: bash
        run: |
          for d in "." "app" "desktop-app" "handbridge-app"; do
            if [ -f "$d/package.json" ] && [ -f "$d/scripts/dist.cjs" ]; then
              echo "app_dir=$d" >> "$GITHUB_OUTPUT"
              echo "dist_dir=$d/dist" >> "$GITHUB_OUTPUT"
              echo "Using app directory: $d"
              exit 0
            fi
          done
          echo "::error::Could not find Electron app directory (expected package.json + scripts/dist.cjs)."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.paths.outputs.app_dir }}/package-lock.json

      # postinstall vendors MediaPipe WASM + downloads hand_landmarker.task (network required once per job).
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.paths.outputs.app_dir }}

      - name: Build installers (electron-builder)
        run: npm run dist
        working-directory: ${{ steps.paths.outputs.app_dir }}
        env:
          CI: true
          # Unsigned builds on GitHub-hosted macOS (no Apple Developer cert in CI).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ runner.os }}
          path: ${{ steps.paths.outputs.dist_dir }}/
          if-no-files-found: error
          retention-days: 30

  release:
    if: |
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
      )
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Verify release tag (manual publish)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::Set input \"Release git tag\" (e.g. v0.9.2). That tag must already exist on GitHub."
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      # electron-builder puts NSIS exe + DMGs at dist root, but also win-unpacked/ etc. (~500 files).
      # Attach only installers: *.dmg, *.exe outside win-unpacked/, *.zip (never helpers under unpacked trees).
      - name: Stage installers for Release
        run: |
          mkdir -p release-upload
          find release-assets -type f \( -iname '*.dmg' -o -iname '*.zip' \) -exec cp -n {} release-upload/ \;
          find release-assets -type f -iname '*.exe' ! -path '*/win-unpacked/*' -exec cp -n {} release-upload/ \;
          echo "Release files:"
          ls -la release-upload/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && contains(inputs.release_tag, '-')) || (github.event_name == 'push' && contains(github.ref_name, '-')) }}
          generate_release_notes: true
          overwrite_files: true
          files: release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}