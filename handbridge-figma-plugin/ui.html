<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Bridge</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #f6f7fb;
        --border: rgba(0, 0, 0, 0.12);
        --text: rgba(0, 0, 0, 0.9);
        --muted: rgba(0, 0, 0, 0.6);
        --accent: #0b5cff;
        --ok: #0a8f4e;
        --err: #c53636;
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header {
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      h1 {
        font-size: 13px;
        margin: 0;
        font-weight: 650;
      }
      .sub {
        margin: 4px 0 0;
        font-size: 11px;
        color: var(--muted);
      }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .version {
        font-size: 10px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      main {
        padding: 12px;
        display: grid;
        gap: 10px;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
      }
      input {
        font: inherit;
        font-size: 12px;
        padding: 7px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
      }
      input:focus {
        border-color: rgba(11, 92, 255, 0.5);
        box-shadow: 0 0 0 3px rgba(11, 92, 255, 0.12);
      }
      select {
        font: inherit;
        font-size: 12px;
        padding: 7px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
        background: #fff;
      }
      select:focus {
        border-color: rgba(11, 92, 255, 0.5);
        box-shadow: 0 0 0 3px rgba(11, 92, 255, 0.12);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 7px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        cursor: pointer;
      }
      button.primary {
        border-color: rgba(11, 92, 255, 0.25);
        background: rgba(11, 92, 255, 0.08);
        color: var(--accent);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        font-size: 11px;
        color: var(--muted);
      }
      .status.ok {
        color: var(--ok);
      }
      .status.err {
        color: var(--err);
      }
      .log {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        background: #0b1020;
        color: #e7ecff;
        border-radius: 10px;
        padding: 8px;
        max-height: 140px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .pill {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>Hand Bridge → Figma</h1>
        <span class="version" id="versionLabel">build v?</span>
      </div>
      <p class="sub">Connect to your Hand Bridge WebSocket and apply gesture targets directly.</p>
    </header>
    <main>
      <label>
        Bridge URL (WebSocket)
        <input id="wsUrl" type="text" spellcheck="false" placeholder="ws://localhost:8787" />
      </label>
      <div class="row">
        <button class="primary" id="connectBtn">Connect</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
        <span class="pill" id="connPill">disconnected</span>
      </div>

      <div class="status" id="status">Waiting…</div>

      <div class="row" style="flex-direction: column; align-items: stretch; gap: 8px">
        <span class="status" style="margin: 0">Preview apply (applies change for visual validation):</span>
        <label>
          Layer path
          <input id="dryPath" type="text" spellcheck="false" placeholder="Page 1 / Frame A / Rectangle 1" />
        </label>
        <label>
          Property
          <select id="dryProperty">
            <option value="x">x</option>
            <option value="y">y</option>
            <option value="width">width</option>
            <option value="height">height</option>
            <option value="visible">visible</option>
            <option value="opacity">opacity</option>
            <option value="color">color</option>
            <option value="textContent">text content</option>
            <option value="variants">variants</option>
          </select>
        </label>
        <label>
          Value
          <input id="dryValue" type="text" spellcheck="false" placeholder="true, 0.5, #FF0000, Hello, State=On;Size=L" />
        </label>
        <div class="row">
          <button id="dryRunBtn">Preview apply</button>
          <span class="status" id="dryRunResult">—</span>
        </div>
      </div>

      <div class="status" id="lastGesture">Last gesture: —</div>

      <div class="log" id="log" aria-label="debug log"></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const wsUrlEl = $("wsUrl");
      const connectBtn = $("connectBtn");
      const disconnectBtn = $("disconnectBtn");
      const connPill = $("connPill");
      const statusEl = $("status");
      const logEl = $("log");
      const lastGestureEl = $("lastGesture");
      const versionLabelEl = $("versionLabel");
      const dryPathEl = $("dryPath");
      const dryPropertyEl = $("dryProperty");
      const dryValueEl = $("dryValue");
      const dryRunBtn = $("dryRunBtn");
      const dryRunResultEl = $("dryRunResult");

      const STORAGE_URL_KEY = "handlab.bridgeUrl";
      const DEFAULT_WS_URL = "ws://localhost:8787";

      /** Figma sometimes loads plugin UI in a context where localStorage throws (e.g. data: URLs). */
      function storageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }
      function storageSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          /* ignore */
        }
      }

      wsUrlEl.value = storageGet(STORAGE_URL_KEY) || DEFAULT_WS_URL;

      let ws = null;
      let lastGesture = null; // {id,name,handedness,score}
      let lastTarget = null; // {path,property,value}

      function log(line) {
        const ts = new Date().toLocaleTimeString();
        logEl.textContent = `[${ts}] ${line}\n` + logEl.textContent.slice(0, 4000);
      }

      function setConn(state) {
        connPill.textContent = state;
        connPill.style.borderColor =
          state === "connected" ? "rgba(10,143,78,0.35)" : "rgba(0,0,0,0.12)";
        connectBtn.disabled = state === "connected" || state === "connecting";
        disconnectBtn.disabled = state === "disconnected";
      }

      function postToMain(msg) {
        parent.postMessage({ pluginMessage: msg }, "*");
      }

      /** Figma / Chromium may deliver text frames as string, ArrayBuffer, or Blob. */
      function wsPayloadToText(data) {
        if (typeof data === "string") return data;
        if (data instanceof ArrayBuffer) return new TextDecoder("utf-8").decode(data);
        if (ArrayBuffer.isView(data))
          return new TextDecoder("utf-8").decode(data.buffer, data.byteOffset, data.byteLength);
        return String(data);
      }

      function unwrapPayload(msg) {
        let p = msg && msg.payload;
        if (typeof p === "string") {
          try {
            p = JSON.parse(p);
          } catch {
            return {};
          }
        }
        return p && typeof p === "object" ? p : {};
      }

      /** Hand Lab sends { type: "event", payload: { kind: "gesture_match", gesture, score, target } }. */
      function extractGestureMatch(msg) {
        if (msg == null) return null;
        if (typeof msg === "string") {
          try {
            msg = JSON.parse(msg);
          } catch {
            return null;
          }
        }
        if (typeof msg !== "object") return null;
        const payload = unwrapPayload(msg);
        const kind = payload.kind ?? msg.kind;
        if (kind !== "gesture_match") return null;
        return {
          gesture: payload.gesture && typeof payload.gesture === "object" ? payload.gesture : {},
          score: payload.score,
          target: payload.target && typeof payload.target === "object" ? payload.target : null,
        };
      }

      function handleParsedWsMessage(msg) {
        if (typeof msg === "string") {
          try {
            msg = JSON.parse(msg);
          } catch {
            log(`WS string is not JSON: ${msg.slice(0, 80)}`);
            return;
          }
        }
        const match = extractGestureMatch(msg);
        if (match) {
          const g = match.gesture || {};
          const rawName = typeof g.name === "string" ? g.name.trim() : "";
          lastGesture = {
            id: g.id,
            name: rawName || "(unnamed)",
            handedness: g.handedness || "Unknown",
            score: match.score,
          };
          lastGestureEl.textContent = `Last gesture: ${lastGesture.name} (score ${Number(lastGesture.score).toFixed(3)})`;
          log(`gesture_match: ${lastGesture.name}`);
          if (match.target) {
            lastTarget = match.target;
            if (typeof match.target.path === "string") dryPathEl.value = match.target.path;
            if (typeof match.target.property === "string") dryPropertyEl.value = match.target.property;
            dryValueEl.value =
              match.target.value == null
                ? ""
                : typeof match.target.value === "string"
                  ? match.target.value
                  : JSON.stringify(match.target.value);
          }
          postToMain({ type: "gesture_match", gesture: lastGesture, target: match.target });
          return;
        }
        const p = unwrapPayload(msg);
        if (msg?.type === "event") log(`event (not match) kind=${p.kind ?? "?"}`);
        else log(`msg type=${msg?.type ?? "?"}`);
      }

      connectBtn.onclick = () => {
        const url = wsUrlEl.value.trim();
        if (!url) return;
        storageSet(STORAGE_URL_KEY, url);
        try {
          if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
          setConn("connecting");
          statusEl.textContent = "Connecting…";
          statusEl.className = "status";
          ws = new WebSocket(url);
          ws.onopen = () => {
            setConn("connected");
            statusEl.textContent = "Connected. Waiting for gesture_match events…";
            statusEl.className = "status ok";
            log("WS open");
          };
          ws.onclose = () => {
            setConn("disconnected");
            statusEl.textContent = "Disconnected.";
            statusEl.className = "status";
            log("WS closed");
          };
          ws.onerror = () => {
            statusEl.textContent = "WebSocket error (check allowedDomains + URL).";
            statusEl.className = "status err";
            log("WS error");
          };
          ws.onmessage = (ev) => {
            const data = ev.data;
            if (data instanceof Blob) {
              data
                .text()
                .then((text) => {
                  let msg;
                  try {
                    msg = JSON.parse(text);
                  } catch {
                    log(`Non-JSON (blob): ${text.slice(0, 120)}`);
                    return;
                  }
                  handleParsedWsMessage(msg);
                })
                .catch((e) => log(`Blob read error: ${e.message || e}`));
              return;
            }
            let text;
            try {
              text = wsPayloadToText(data);
            } catch (e) {
              log(`WS decode error: ${e.message || e}`);
              return;
            }
            let msg;
            try {
              msg = JSON.parse(text);
            } catch {
              log(`Non-JSON message: ${text.slice(0, 120)}`);
              return;
            }
            handleParsedWsMessage(msg);
          };
        } catch (e) {
          setConn("disconnected");
          statusEl.textContent = `Failed to connect: ${e.message || e}`;
          statusEl.className = "status err";
          log(`connect exception: ${e.message || e}`);
        }
      };

      disconnectBtn.onclick = () => {
        try {
          ws?.close();
        } catch {}
      };

      dryRunBtn.onclick = () => {
        const path = dryPathEl.value.trim();
        const property = dryPropertyEl.value.trim();
        const valueRaw = dryValueEl.value;
        let value = valueRaw;
        const v = valueRaw.trim();
        if (v.startsWith("{") && v.endsWith("}")) {
          try {
            value = JSON.parse(v);
          } catch {
            // Keep as raw string if not valid JSON.
          }
        }
        postToMain({ type: "dry_run_target", target: { path, property, value } });
        dryRunResultEl.textContent = "Applying preview…";
        log(`dry_run: path="${path}" property="${property}"`);
      };

      window.onmessage = (event) => {
        const msg = event?.data?.pluginMessage;
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "plugin_version") {
          versionLabelEl.textContent = `build v${msg.version || "?"}`;
          return;
        }
        if (msg.type === "dry_run_result") {
          dryRunResultEl.textContent = msg.message || "Done";
          log(`dry_run_result: ${msg.message || "(no message)"}`);
        }
      };

      postToMain({ type: "request_version" });
      setConn("disconnected");
      log("UI ready");
    </script>
  </body>
</html>
